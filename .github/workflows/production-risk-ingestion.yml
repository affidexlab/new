name: Production Risk Ingestion

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which ingestion job to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ofac
          - sanctions
          - public-feeds
          - curated
          - graph-backfill
          - calibrate

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: affidexlab/new/backend
    env:
      NODE_ENV: production
      RISK_PROVIDER: internal
      ALLOW_DEMO_RISK: 'false'
      ALLOW_PARTIAL_SANCTIONS_INGESTION: 'false'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
      UN_CONSOLIDATED_SANCTIONS_URL: ${{ secrets.UN_CONSOLIDATED_SANCTIONS_URL }}
      EU_CONSOLIDATED_SANCTIONS_URL: ${{ secrets.EU_CONSOLIDATED_SANCTIONS_URL }}
      UK_HMT_CONSOLIDATED_SANCTIONS_URL: ${{ secrets.UK_HMT_CONSOLIDATED_SANCTIONS_URL }}
      ALLOW_PARTIAL_PUBLIC_RISK_INGESTION: 'false'
      DECAFLOW_PUBLIC_RISK_FEED_URLS: ${{ secrets.DECAFLOW_PUBLIC_RISK_FEED_URLS }}
      RISK_GRAPH_BACKFILL_TARGETS: ${{ secrets.RISK_GRAPH_BACKFILL_TARGETS }}
      RISK_GRAPH_BACKFILL_FROM_BLOCK: ${{ secrets.RISK_GRAPH_BACKFILL_FROM_BLOCK }}
      RISK_GRAPH_BACKFILL_TO_BLOCK: ${{ secrets.RISK_GRAPH_BACKFILL_TO_BLOCK }}
      RISK_GRAPH_BACKFILL_MAX_PAGES: ${{ secrets.RISK_GRAPH_BACKFILL_MAX_PAGES }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run OFAC ingestion
        if: ${{ github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'ofac' }}
        run: npm run ingest:ofac

      - name: Run public sanctions ingestion
        if: ${{ github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'sanctions' }}
        run: npm run ingest:sanctions

      - name: Run public scam and phishing feed ingestion
        if: ${{ github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'public-feeds' }}
        run: npm run ingest:public-feeds

      - name: Run curated label ingestion
        if: ${{ github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'curated' }}
        run: npm run ingest:curated

      - name: Run targeted graph backfill
        if: ${{ github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'graph-backfill' }}
        run: npm run risk:backfill-graph

      - name: Run risk calibration check
        if: ${{ github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'calibrate' }}
        run: npm run risk:calibrate
