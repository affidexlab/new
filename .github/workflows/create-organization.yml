name: Create Organization

on:
  workflow_dispatch:
    inputs:
      organization_name:
        description: 'Organization/customer name'
        required: true
      owner_email:
        description: 'Owner email address'
        required: true
      owner_name:
        description: 'Owner name'
        required: false
        default: ''
      scopes:
        description: 'Comma-separated API key scopes'
        required: true
        default: 'verify:check,risk:screen'

jobs:
  create:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: affidexlab/new/backend
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Create organization and API key
        run: npm run org:create -- "${{ inputs.organization_name }}" "${{ inputs.owner_email }}" "${{ inputs.owner_name }}" "${{ inputs.scopes }}"
